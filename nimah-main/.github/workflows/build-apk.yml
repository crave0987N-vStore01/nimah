name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # No API keys are put into the APK. Users paste their own key inside the app (stored encrypted).
      - name: Create config (no secrets)
        run: cp src/config.example.ts src/config.ts

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --ext .ts,.tsx --quiet

      - name: Unit tests
        run: npx jest --ci

      - name: Decode release keystore (only if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "NIMAH_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNING=release-key" >> "$GITHUB_ENV"
          else
            echo "SIGNING=debug-key (no KEYSTORE_BASE64 secret)" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: android
        env:
          NIMAH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NIMAH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NIMAH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          test -s "$APK" || { echo "APK missing or empty"; exit 1; }
          mkdir -p dist && cp "$APK" dist/Nimah-AI-release.apk
          SIZE=$(stat -c %s dist/Nimah-AI-release.apk)
          SHA=$(sha256sum dist/Nimah-AI-release.apk | cut -d' ' -f1)
          {
            echo "### Nimah AI build #${{ github.run_number }}"
            echo "- APK size: $SIZE bytes"
            echo "- SHA-256: \`$SHA\`"
            echo "- Signed with: $SIGNING"
          } >> "$GITHUB_STEP_SUMMARY"
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -n 1)
          "$AS" verify "dist/Nimah-AI-release.apk" && echo "apksigner: signature OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nimah-AI-Release-APK
          path: dist/Nimah-AI-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            android/app/build/reports
            android/build/reports
          if-no-files-found: ignore
