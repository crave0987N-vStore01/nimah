name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v2
        continue-on-error: true   # the runner already has the Android SDK; this is only a safety net

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install

      # config.ts is NOT in git (it holds keys). Build it from the example + GitHub Secrets.
      - name: Create src/config.ts from secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node -e "
          const fs = require('fs');
          let s = fs.readFileSync('src/config.example.ts', 'utf8');
          s = s.replace('YOUR_GEMINI_API_KEY', process.env.GEMINI_API_KEY || '');
          fs.writeFileSync('src/config.ts', s);
          "

      - name: Run tests
        run: npm test

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nimah-apk
          path: android/app/build/outputs/apk/release/app-release.apk
