name: Build Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (Zulu 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      # Android SDK is preinstalled on the runner; only accept licenses
      - name: Accept Android SDK licenses
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # src/config.ts is git-ignored but imported by the app
      - name: Create config from example
        run: cp src/config.example.ts src/config.ts

      # Debug builds skip JS bundling by default; embed it so the APK runs without Metro
      - name: Embed JS bundle in debug build
        run: |
          sed -i 's|^\s*//\s*debuggableVariants = .*|    debuggableVariants = []|' android/app/build.gradle
          grep -q '^\s*debuggableVariants = \[\]' android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Verify APK
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          test -s "$APK"
          echo "APK: $APK ($(stat -c %s "$APK") bytes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            android/app/build/reports
            android/build/reports
          if-no-files-found: ignore
